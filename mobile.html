<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>清展科技-品保部 | 手機版測驗與題庫</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0f172a; color: #f8fafc; margin: 0; padding: 10px; 
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; overflow: hidden;
        }

        /* 📱 手機版首頁 */
        #mode-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 15px; padding: 20px;
        }
        .mode-title { font-size: 28px; margin-bottom: 20px; color: #f8fafc; text-align: center; line-height: 1.4; font-weight: 900;}
        .mode-btn {
            padding: 18px 20px; font-size: 20px; font-weight: 900;
            background: #38bdf8; color: #0f172a; border: none; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%; max-width: 350px; text-align: center;
        }
        .mode-btn.exam { background: #fbbf24; }
        .mode-btn.gallery { background: #c084fc; color: #fff; }
        .mode-btn.back { background: #475569; color: #fff; margin-top: 20px; }

        /* 📱 手機版題庫 (列表式) */
        #gallery-screen {
            width: 100%; height: 100%; display: none; flex-direction: column;
        }
        .gallery-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 5px 15px 5px; border-bottom: 2px solid #334155; margin-bottom: 10px;
        }
        .gallery-header h2 { margin: 0; font-size: 22px; color: #f8fafc; }
        
        .gallery-nav { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab-btn {
            flex: 1; padding: 12px; background: #334155; border: 2px solid #475569;
            color: #cbd5e1; border-radius: 8px; font-size: 16px; font-weight: bold;
        }
        .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .tab-btn.active.exam-tab { background: #fbbf24; border-color: #fbbf24; }

        /* 列表按鈕 */
        #gallery-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px;
        }
        .gallery-list-btn {
            width: 100%; padding: 16px 20px; background: #1e293b; border: 1px solid #334155;
            border-radius: 12px; color: #f8fafc; font-size: 18px; font-weight: 700;
            text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* 📱 圖片放大彈出視窗 (Modal) */
        #image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 999; 
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        #modal-img { max-width: 100%; max-height: 60vh; border-radius: 8px; border: 2px solid #475569; display: none; }
        #modal-text-q { font-size: 22px; color: #38bdf8; text-align: center; line-height: 1.4; display: none; margin-bottom: 20px; }
        #modal-caption { margin-top: 20px; font-size: 26px; font-weight: 900; color: #4ade80; background: #064e3b; padding: 8px 30px; border-radius: 20px; text-align: center; }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 50px; color: #cbd5e1; background: none; border: none; padding: 0; line-height: 1;}

        /* 📱 測驗容器 (上下排列) */
        .container { width: 100%; height: 100%; display: none; flex-direction: column; }
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 16px; font-weight: 800; padding-bottom: 10px; margin-bottom: 10px;
            border-bottom: 2px solid #334155;
        }
        
        #img-wrapper {
            position: relative; width: 100%; display: block;
            border: 2px solid #475569; border-radius: 8px; overflow: hidden; background: #000;
        }
        #quiz-img { width: 100%; height: auto; display: block; }
        #mask { position: absolute; background: #000; z-index: 10; border-radius: 4px; box-shadow: 0 0 3px rgba(0,0,0,0.5); }

        #quiz-text {
            display: none; font-size: 24px; font-weight: 900; color: #38bdf8;
            text-align: center; padding: 40px 10px; line-height: 1.4; background: #1e293b;
            border-radius: 8px; border: 1px solid #475569;
        }

        .right-panel {
            flex: 1; display: flex; flex-direction: column; margin-top: 15px;
            background: #1e293b; padding: 15px; border-radius: 12px;
        }
        #feedback { 
            font-size: 18px; font-weight: 700; margin-bottom: 15px; 
            min-height: 45px; display: flex; align-items: center; justify-content: center;
            text-align: center; border-radius: 8px;
        }
        .feedback-correct { background: #064e3b; color: #4ade80; }
        .feedback-wrong { background: #7f1d1d; color: #f87171; }
        
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        button.option-btn { 
            padding: 15px 5px; border: 1px solid #475569; background: #334155; 
            color: #f8fafc; border-radius: 8px; font-size: 16px; font-weight: 700; 
        }
        .selected-correct { background: #22c55e !important; color: white !important; }
        .selected-wrong { background: #ef4444 !important; color: white !important; }
        
        .bottom-actions { margin-top: auto; display: flex; justify-content: center; padding-top: 15px; }

        /* 結算畫面 */
        #result-screen { width: 100%; display: none; flex-direction: column; align-items: center; height: 100%; }
        #wrong-list-container {
            width: 100%; flex: 1; overflow-y: auto; background: #1e293b; 
            border-radius: 12px; padding: 10px; margin-bottom: 10px;
        }
        .wrong-card { background: #334155; border-radius: 8px; padding: 10px; margin-bottom: 10px; text-align: center; }
        .wrong-img { width: 100%; max-height: 120px; object-fit: contain; background: #000; border-radius: 6px; }
        .wrong-info { font-size: 16px; font-weight: 700; margin-top: 10px;}
        .wrong-ans { color: #f87171; }
        .correct-ans { color: #4ade80; }
    </style>
</head>
<body>

<div id="mode-screen">
    <div class="mode-title">清展科技-品保部<br>【手機版測驗】</div>
    <button class="mode-btn" onclick="startQuiz('color')">🎨 一般色卡辨識</button>
    <button class="mode-btn exam" onclick="startQuiz('standard')">🔍 檢驗標準測試</button>
    <button class="mode-btn gallery" onclick="showGallery()">📚 手機版題庫</button>
    <button class="mode-btn back" onclick="window.location.href='index.html'">💻 返回電腦版首頁</button>
</div>

<div id="gallery-screen">
    <div class="gallery-header">
        <h2>📚 手機版題庫</h2>
        <button class="mode-btn exam" style="font-size: 14px; padding: 6px 12px; width: auto; margin: 0;" onclick="location.reload()">🏠 首頁</button>
    </div>
    <div class="gallery-nav">
        <button id="tab-color" class="tab-btn active" onclick="renderGallery('color')">🎨 色卡</button>
        <button id="tab-standard" class="tab-btn" onclick="renderGallery('standard')">🔍 檢驗標準</button>
    </div>
    <div id="gallery-list">
        </div>
</div>

<div id="image-modal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modal-text-q" onclick="event.stopPropagation()"></div>
    <img id="modal-img" src="" alt="圖片" onclick="event.stopPropagation()">
    <div id="modal-caption" onclick="event.stopPropagation()"></div>
</div>

<div class="container" id="quiz-container">
    <div class="header">
        <span id="quiz-title">載入中...</span>
        <span>進度: <span id="cur">1</span>/<span id="total">0</span> | 得分: <span id="score">0</span></span>
    </div>
    <div id="img-wrapper">
        <img id="quiz-img" src="">
        <div id="mask"></div>
    </div>
    <div id="quiz-text"></div>

    <div class="right-panel">
        <div id="feedback">請選擇正確答案</div>
        <div class="btn-grid" id="btns"></div>
        <div class="bottom-actions">
            <button class="mode-btn back" style="padding: 10px 20px; font-size: 16px; margin: 0;" onclick="location.reload()">🏠 結束測驗</button>
        </div>
    </div>
</div>

<div id="result-screen">
    <h2 style="color: #f8fafc; margin-bottom: 5px;">測驗結束</h2>
    <div style="font-size: 32px; font-weight: 900; color: #fbbf24; margin-bottom: 15px;">得分：<span id="final-score-text">0/0</span></div>
    <div id="wrong-list-container"></div>
    <button class="mode-btn exam" onclick="location.reload()">🏠 返回首頁</button>
</div>

<script>
    const colorOptions = ["120A", "121A", "220B", "231B", "292K", "801K", "813B", "870B", "877K", "882C", "920A", "921B", "923K", "926C"];
    const colorLibrary = [
        { url: "colors/120A.png", ans: "120A", maskT: 44, maskL: 60, maskW: 18, maskH: 11, opts: colorOptions },
        { url: "colors/121A.jpg", ans: "121A", maskT: 44, maskL: 65, maskW: 18, maskH: 11, opts: colorOptions },
        { url: "colors/220B.jpg", ans: "220B", maskT: 40, maskL: 65, maskW: 18, maskH: 12, opts: colorOptions },
        { url: "colors/231B.png", ans: "231B", maskT: 31, maskL: 73, maskW: 20, maskH: 16, opts: colorOptions },
        { url: "colors/292K.png", ans: "292K", maskT: 35, maskL: 14, maskW: 35, maskH: 15, opts: colorOptions },
        { url: "colors/801K.jpg", ans: "801K", maskT: 30, maskL: 60, maskW: 20, maskH: 18, opts: colorOptions },
        { url: "colors/813B.jpg", ans: "813B", maskT: 50, maskL: 69, maskW: 22, maskH: 15, opts: colorOptions },
        { url: "colors/870B.jpg", ans: "870B", maskT: 46.5, maskL: 72.5, maskW: 18, maskH: 14, opts: colorOptions },
        { url: "colors/877K.png", ans: "877K", maskT: 28, maskL: 65, maskW: 20, maskH: 18, opts: colorOptions },
        { url: "colors/882C.jpg", ans: "882C", maskT: 40, maskL: 68, maskW: 19, maskH: 14, opts: colorOptions },
        { url: "colors/920A.jpg", ans: "920A", maskT: 44, maskL: 65, maskW: 18, maskH: 11, opts: colorOptions },
        { url: "colors/921B.jpg", ans: "921B", maskT: 44, maskL: 65, maskW: 18, maskH: 11, opts: colorOptions },
        { url: "colors/923K.jpg", ans: "923K", maskT: 30, maskL: 68, maskW: 20, maskH: 18, opts: colorOptions },
        { url: "colors/926C.jpg", ans: "926C", maskT: 32, maskL: 72, maskW: 20, maskH: 18, opts: colorOptions }
    ];

    const standardLibrary = [
        { type: "text", text: "📝 請問「亮光」的代表號是？", ans: "A", opts: ["A", "B", "C", "K", "Q", "Y"] },
        { type: "text", text: "📝 請問「平光」的代表號是？", ans: "B", opts: ["A", "B", "C", "K", "Q", "Y"] },
        { type: "text", text: "📝 請問「消光」的代表號是？", ans: "C", opts: ["A", "B", "C", "K", "Q", "Y"] },
        { type: "text", text: "📝 請問「混合白點」的代表號是？", ans: "Q", opts: ["A", "B", "C", "K", "Q", "Y"] },
        { type: "text", text: "📝 請問「混合金點」的代表號是？", ans: "Y", opts: ["A", "B", "C", "K", "Q", "Y"] },
        { type: "text", text: "📝 請問「砂紋」的代表號是？", ans: "K", opts: ["A", "B", "C", "K", "Q", "Y"] },
        { type: "text", text: "📝 請問「毛料硬度」的標準規格範圍是？", ans: "11~14", opts: ["1~10", "11~14", "15~20", "21~25", "26~30"] },
        { type: "text", text: "📝 請問「粉體模厚」的標準規格範圍是？", ans: "40um~130um", opts: ["8um~30um", "40um~130um", "130um~150um", "150um~200um"] },
        { type: "text", text: "📝 請問「陽極(電鍍)模厚」的標準規格範圍是？", ans: "8um~30um", opts: ["8um~30um", "40um~130um", "130um~150um", "150um~200um"] },
        { url: "standards/毛料-刮傷.jpg", ans: "刮傷", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },
        { url: "standards/毛料-尺寸不良.jpg", ans: "尺寸不良", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },
        { url: "standards/毛料-撞傷撞凹.jpg", ans: "撞傷", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },
        { url: "standards/毛料-模具痕.jpg", ans: "模具痕", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },
        { url: "standards/毛料-氧化1.jpg", ans: "氧化", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },
        { url: "standards/毛料-破洞or氣孔.jpg", ans: "破洞氣孔", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良", "破洞氣孔"] },
        { url: "standards/毛料-變形.jpg", ans: "變形", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良", "破洞氣孔"] },
        { url: "standards/粉體-掛勾痕.jpg", ans: "掛勾痕", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },
        { url: "standards/粉體-模具痕.jpg", ans: "模具痕", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },
        { url: "standards/粉體-模厚過厚.jpg", ans: "模厚過厚", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },
        { url: "standards/粉體-橘皮.jpg", ans: "橘皮", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },
        { url: "standards/粉體-火山口.jpg", ans: "火山口", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },
        { url: "standards/粉體-髒污.jpg", ans: "髒污", maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },
        { url: "standards/陽極-模具痕.jpg", ans: "模具痕", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-氣泡.jpg", ans: "氣泡", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-氧化.jpg", ans: "氧化", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-色差.jpg", ans: "色差", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-電鍍不全.jpg", ans: "電鍍不全", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-電鍍流痕.jpg", ans: "電鍍流痕", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] }
    ];

    let currentData = [], idx = 0, score = 0, wrongAnswers = [];

    // --- 📱 手機版專屬：列表題庫渲染邏輯 ---
    function showGallery() {
        document.getElementById('mode-screen').style.display = 'none';
        document.getElementById('gallery-screen').style.display = 'flex';
        renderGallery('color'); // 預設顯示色卡
    }

    function renderGallery(type) {
        document.getElementById('tab-color').classList.remove('active', 'exam-tab');
        document.getElementById('tab-standard').classList.remove('active', 'exam-tab');
        if (type === 'color') document.getElementById('tab-color').classList.add('active');
        else document.getElementById('tab-standard').classList.add('active', 'exam-tab');

        const list = document.getElementById('gallery-list');
        list.innerHTML = ""; 
        const dataToRender = (type === 'color') ? colorLibrary : standardLibrary;
        
        dataToRender.forEach(item => {
            const btn = document.createElement('button');
            btn.className = "gallery-list-btn";
            
            // 💡 智慧抓取檔名作為按鈕文字
            let displayName = "";
            if (type === 'color') {
                displayName = "🎨 " + item.ans;
            } else {
                if (item.type === "text") {
                    displayName = "📝 " + item.text;
                } else {
                    // 自動從網址中擷取「毛料-刮傷」這段文字
                    let fileName = decodeURI(item.url).split('/').pop().replace(/\.(jpg|png|jpeg)$/i, '');
                    displayName = "🖼️ " + fileName;
                }
            }
            btn.innerText = displayName;
            
            // 綁定點擊事件，彈出圖片
            btn.onclick = () => {
                if (item.type === "text") {
                    openModal("", item.ans, item.text);
                } else {
                    openModal(encodeURI(item.url), item.ans, "");
                }
            };
            list.appendChild(btn);
        });
    }

    // --- 圖片/文字彈出視窗 ---
    function openModal(url, ans, textQ) {
        const img = document.getElementById('modal-img');
        const txt = document.getElementById('modal-text-q');
        
        if (url) {
            img.src = url;
            img.style.display = 'block';
            txt.style.display = 'none';
        } else {
            img.style.display = 'none';
            txt.innerText = textQ;
            txt.style.display = 'block';
        }
        
        document.getElementById('modal-caption').innerText = ans;
        document.getElementById('image-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('image-modal').style.display = 'none';
    }

    // --- 測驗流程 ---
    function startQuiz(mode) {
        document.getElementById('mode-screen').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'flex';
        currentData = (mode === 'color') ? [...colorLibrary] : [...standardLibrary];
        document.getElementById('quiz-title').innerText = (mode === 'color') ? "🎨 色卡" : "🔍 檢驗";
        currentData.sort(() => Math.random() - 0.5);
        idx = 0; score = 0; wrongAnswers = [];
        document.getElementById('total').innerText = currentData.length;
        init();
    }

    function showResultScreen() {
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('final-score-text').innerText = `${score} / ${currentData.length}`;
        const listContainer = document.getElementById('wrong-list-container');
        listContainer.innerHTML = "";

        if (wrongAnswers.length === 0) {
            listContainer.innerHTML = `<div style="text-align: center; padding: 40px; font-size: 20px; color: #4ade80;">🎉 完美通關！</div>`;
        } else {
            wrongAnswers.forEach(wrong => {
                let mediaHtml = wrong.item.type === "text" ? `<div style="font-size:16px; color:#38bdf8;">${wrong.item.text}</div>` : `<img src="${encodeURI(wrong.item.url)}" class="wrong-img">`;
                listContainer.innerHTML += `
                    <div class="wrong-card">
                        ${mediaHtml}
                        <div class="wrong-info">
                            <span class="wrong-ans">選錯: ${wrong.userAns}</span> | 
                            <span class="correct-ans">正確: ${wrong.item.ans}</span>
                        </div>
                    </div>`;
            });
        }
    }

    function init() {
        if (idx >= currentData.length) { showResultScreen(); return; }
        const item = currentData[idx];
        const img = document.getElementById('quiz-img'), txt = document.getElementById('quiz-text'), 
              msk = document.getElementById('mask'), fbk = document.getElementById('feedback'),
              wrapper = document.getElementById('img-wrapper');

        if (item.type === "text") {
            wrapper.style.display = 'none';
            txt.style.display = 'block'; txt.innerText = item.text;
        } else {
            txt.style.display = 'none'; wrapper.style.display = 'block';
            img.src = encodeURI(item.url);
            
            // 暴力定錨：因為 wrapper 寬度是 100%，高度自動跟隨，絕不跑位
            msk.style.top = (item.maskT || 0) + "%"; msk.style.left = (item.maskL || 0) + "%";
            msk.style.width = (item.maskW || 100) + "%"; msk.style.height = (item.maskH || 0) + "%";
            msk.style.display = (item.maskH > 0) ? 'block' : 'none';
        }
        
        fbk.innerText = "請選擇正確答案"; fbk.className = ""; 
        document.getElementById('cur').innerText = idx + 1;
        
        const area = document.getElementById('btns'); area.innerHTML = "";
        item.opts.forEach(c => {
            const b = document.createElement('button'); b.className = "option-btn"; b.innerText = c;
            b.onclick = () => checkAnswer(c, item.ans, b, (item.type !== "text" && item.maskH > 0));
            area.appendChild(b);
        });
    }

    function checkAnswer(selected, correct, btn, hasMask) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        if(hasMask) document.getElementById('mask').style.display = 'none';
        const fbk = document.getElementById('feedback');
        
        if (selected === correct) {
            score++; document.getElementById('score').innerText = score;
            fbk.innerText = "✔ 正確！"; fbk.className = "feedback-correct"; btn.classList.add('selected-correct');
            setTimeout(() => { idx++; init(); }, 300); 
        } else {
            wrongAnswers.push({ item: currentData[idx], userAns: selected });
            fbk.innerText = "✘ 錯誤！"; fbk.className = "feedback-wrong"; btn.classList.add('selected-wrong');
            setTimeout(() => { alert("正確答案為：" + correct); idx++; init(); }, 100);
        }
    }
</script>
</body>
</html>
