<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>健合實業 | 色卡辨識訓練系統 (左圖右鈕版)</title>
    <style>
        * { box-sizing: border-box; cursor: default; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; overflow: hidden;
        }

        .container {
            width: 100%; max-width: 1400px; background: #1e293b;
            padding: 20px; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; height: 95vh;
        }

        .header { 
            display: flex; justify-content: space-between; margin-bottom: 15px; 
            font-size: 22px; font-weight: 800; border-bottom: 2px solid #334155; padding-bottom: 10px;
        }

        /* 核心分欄佈局 */
        .main-content {
            display: flex; flex: 1; gap: 20px; min-height: 0;
        }

        /* 左側圖片區 */
        .left-panel {
            flex: 7; position: relative; background: #000; 
            border-radius: 12px; overflow: hidden; border: 1px solid #475569;
            display: flex; align-items: center; justify-content: center;
        }

        #quiz-img { 
            max-width: 100%; max-height: 100%; object-fit: contain; 
            image-rendering: -webkit-optimize-contrast; 
        }

        #mask { 
            position: absolute; left: 0; width: 100%; background: #000; 
            z-index: 10; border-bottom: 1px solid #334155;
        }

        /* 右側控制區 */
        .right-panel {
            flex: 3; display: flex; flex-direction: column; background: #334155;
            padding: 20px; border-radius: 12px; overflow-y: auto;
        }

        #feedback { 
            font-size: 22px; font-weight: 700; margin-bottom: 20px; 
            min-height: 60px; display: flex; align-items: center; justify-content: center;
            text-align: center; border-radius: 8px;
        }
        .feedback-correct { background: #064e3b; color: #4ade80; }
        .feedback-wrong { background: #7f1d1d; color: #f87171; }

        .btn-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; 
        }
        button.option-btn { 
            padding: 15px 0; border: 1px solid #475569; background: #1e293b; 
            color: #f8fafc; border-radius: 8px; font-size: 18px; font-weight: 700; 
            cursor: pointer; transition: 0.2s;
        }
        button.option-btn:hover:not(:disabled) { background: #38bdf8; color: #0f172a; }
        .selected-correct { background: #22c55e !important; color: white !important; }
        .selected-wrong { background: #ef4444 !important; color: white !important; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>📊 進度: <span id="cur">1</span> / 12</div>
        <div>🏆 分數: <span id="score">0</span></div>
    </div>

    <div class="main-content">
        <div class="left-panel">
            <img id="quiz-img" src="">
            <div id="mask"></div>
        </div>

        <div class="right-panel">
            <div id="feedback">準備開始...</div>
            <div class="btn-grid" id="btns"></div>
        </div>
    </div>
</div>

<script>
    const quizData = [
        { url: "https://i.postimg.cc/jqfpgmv1/S-141926458-0.jpg", ans: "877K", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/9X968KJV/S-141926459-0.jpg", ans: "801K", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/44cDLqBs/S-141926460-0.jpg", ans: "923K", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/G3DW7VqR/S-141926461-0.jpg", ans: "926C", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/T2bz7FCT/S-141926462-0.jpg", ans: "920A", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/wxNCfZ0x/S-141926463-0.jpg", ans: "921B", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/zDhst60B/S-141926464-0.jpg", ans: "120A", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/jqfpgmZC/S-141926465-0.jpg", ans: "121A", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/ZYNG72VB/S-141926466-0.jpg", ans: "292K", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/J4W99x2h/S-141926467-0.jpg", ans: "220B", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/YqwJJRs0/S-141926469-0.jpg", ans: "813B", maskT: 0, maskH: 35 },
        { url: "https://i.postimg.cc/J4W99x2n/S-141926470-0.jpg", ans: "920A", maskT: 0, maskH: 35 }
    ];

    const codes = ["877K", "801K", "923K", "926C", "920A", "921B", "120A", "121A", "292K", "220B", "813B"];
    
    quizData.sort(() => Math.random() - 0.5);

    let idx = 0, score = 0;

    function init() {
        if (idx >= quizData.length) {
            alert("🌟 訓練結束！總得分：" + score + " / " + quizData.length);
            location.reload();
            return;
        }

        const item = quizData[idx];
        const img = document.getElementById('quiz-img');
        const mask = document.getElementById('mask');
        const feedback = document.getElementById('feedback');
        
        img.src = item.url;
        mask.style.top = item.maskT + "%";
        mask.style.height = item.maskH + "%";
        mask.style.display = 'block';

        feedback.innerText = "請點擊正確編號";
        feedback.className = "";
        document.getElementById('cur').innerText = idx + 1;
        
        const area = document.getElementById('btns');
        area.innerHTML = "";
        
        codes.forEach(c => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = c;
            b.onclick = () => checkAnswer(c, item.ans, b);
            area.appendChild(b);
        });
    }

    function checkAnswer(selected, correct, btnElement) {
        const feedback = document.getElementById('feedback');
        const mask = document.getElementById('mask');
        
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
        mask.style.display = 'none';

        if (selected === correct) {
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✔ 正確！";
            feedback.className = "feedback-correct";
            btnElement.classList.add('selected-correct');
            
            setTimeout(() => {
                idx++;
                init();
            }, 800); 
        } else {
            feedback.innerText = "✘ 錯誤！";
            feedback.className = "feedback-wrong";
            btnElement.classList.add('selected-wrong');
            
            setTimeout(() => {
                alert("【答錯提醒】\n\n這張色卡的編號是：" + correct);
                idx++;
                init();
            }, 100);
        }
    }

    window.onload = init;
</script>
</body>
</html>
