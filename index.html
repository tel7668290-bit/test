<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健合實業 | 色卡辨識訓練電腦版</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #f4f7f6; margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh;
        }

        /* 電腦版大框架 */
        .container {
            width: 100%;
            max-width: 1100px; /* 整體放大 */
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header { 
            display: flex; justify-content: space-between; 
            margin-bottom: 20px; font-size: 20px; font-weight: bold; color: #333;
            border-bottom: 2px solid #eee; padding-bottom: 10px;
        }
        .header span { color: #2563eb; }

        /* 圖片顯示區域極大化 */
        .img-box { 
            position: relative; 
            width: 100%; 
            height: 600px; /* 增加高度 */
            background: #000; 
            border-radius: 10px; 
            overflow: hidden; 
            margin-bottom: 20px;
        }
        #quiz-img { 
            width: 100%; height: 100%; 
            object-fit: contain; /* 確保不失真，完整解析度 */
            image-rendering: -webkit-optimize-contrast;
        }

        /* 遮罩：徹底遮住頂部公司名與編號 */
        .mask { 
            position: absolute; top: 0; left: 0; width: 100%; height: 28%; 
            background: #000; /* 全黑遮蔽 */
            z-index: 5; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; letter-spacing: 2px;
        }

            font-size: 22px; font-weight: 700; margin: 15px 0; min-height: 50px; 
            display: flex; align-items: center; justify-content: center; border-radius: 10px;
        }
