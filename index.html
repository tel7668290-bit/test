<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>清展科技-品保部 | 辨色與檢驗標準測試</title>
    <style>
        * { box-sizing: border-box; cursor: default; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; overflow: hidden;
        }

        #mode-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 30px; transition: opacity 0.5s;
        }
        .mode-title { font-size: 48px; margin-bottom: 20px; color: #f8fafc; letter-spacing: 2px; }
        .mode-btn {
            padding: 25px 60px; font-size: 28px; font-weight: 900;
            background: #38bdf8; color: #0f172a; border: none; border-radius: 20px;
            cursor: pointer; transition: 0.2s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 400px; text-align: center;
        }
        .mode-btn:hover { transform: translateY(-5px); background: #7dd3fc; }
        .mode-btn.exam { background: #fbbf24; }
        .mode-btn.exam:hover { background: #fcd34d; }

        .container {
            width: 100%; max-width: 1400px; background: #1e293b;
            padding: 20px; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: none; 
            flex-direction: column; height: 95vh;
        }

        .header { 
            display: flex; justify-content: space-between; margin-bottom: 15px; 
            font-size: 22px; font-weight: 800; border-bottom: 2px solid #334155; padding-bottom: 10px;
        }
        .header span { color: #38bdf8; }

        .main-content { display: flex; flex: 1; gap: 20px; min-height: 0; }

        .left-panel {
            flex: 7; position: relative; background: #000; 
            border-radius: 12px; overflow: hidden; border: 1px solid #475569;
            display: flex; align-items: center; justify-content: center;
        }

        #quiz-img { 
            max-width: 100%; max-height: 100%; object-fit: contain; 
            image-rendering: -webkit-optimize-contrast; 
        }

        #quiz-text {
            display: none; font-size: 48px; font-weight: 900; color: #38bdf8;
            text-align: center; padding: 40px; line-height: 1.4; letter-spacing: 2px;
        }

        #mask { 
            position: absolute; left: 0; width: 100%; background: #000; 
            z-index: 10; border-bottom: 1px solid #334155;
        }

        .right-panel {
            flex: 3; display: flex; flex-direction: column; background: #334155;
            padding: 20px; border-radius: 12px; overflow-y: auto;
        }

        #feedback { 
            font-size: 22px; font-weight: 700; margin-bottom: 20px; 
            min-height: 60px; display: flex; align-items: center; justify-content: center;
            text-align: center; border-radius: 8px;
        }
        .feedback-correct { background: #064e3b; color: #4ade80; }
        .feedback-wrong { background: #7f1d1d; color: #f87171; }

        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        button.option-btn { 
            padding: 12px 5px; border: 1px solid #475569; background: #1e293b; 
            color: #f8fafc; border-radius: 8px; font-size: 16px; font-weight: 700; 
            cursor: pointer; transition: 0.2s; text-align: center;
        }
        button.option-btn:hover:not(:disabled) { background: #38bdf8; color: #0f172a; }
        .selected-correct { background: #22c55e !important; color: white !important; }
        .selected-wrong { background: #ef4444 !important; color: white !important; }
        
        #preload-status {
            color: #94a3b8; font-size: 14px; margin-top: 20px; font-style: italic;
        }
    </style>
</head>
<body>

<div id="mode-screen">
    <div class="mode-title">清展科技-品保部 | 教育訓練系統</div>
    <button class="mode-btn" onclick="startQuiz('color')">🎨 一般色卡辨識</button>
    <button class="mode-btn exam" onclick="startQuiz('standard')">🔍 檢驗標準測試</button>
    <div id="preload-status">⏳ 圖片資源預先載入中...</div>
</div>

<div class="container" id="quiz-container">
    <div class="header">
        <div id="quiz-title">模式載入中...</div>
        <div>📊 進度: <span id="cur">1</span> / <span id="total">0</span> &nbsp;|&nbsp; 🏆 得分: <span id="score">0</span></div>
    </div>

    <div class="main-content">
        <div class="left-panel">
            <img id="quiz-img" src="">
            <div id="quiz-text"></div>
            <div id="mask"></div>
        </div>
        <div class="right-panel">
            <div id="feedback">請根據圖片或題目選擇正確答案</div>
            <div class="btn-grid" id="btns"></div>
        </div>
    </div>
</div>

<script>
    // --- 一般色卡辨識 (更新為 GitHub 截圖中的 14 個檔案) ---
    const colorOptions = ["120A", "121A", "220B", "231B", "292K", "801K", "813B", "870B", "877K", "882C", "920A", "921B", "923K", "926C"];
    
    const colorLibrary = [
        { url: "colors/120A.png", ans: "120A", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/121A.jpg", ans: "121A", maskT: 10, maskH: 35, opts: colorOptions }, // 保留你之前微調過的遮罩位置
        { url: "colors/220B.jpg", ans: "220B", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/231B.png", ans: "231B", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/292K.png", ans: "292K", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/801K.jpg", ans: "801K", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/813B.jpg", ans: "813B", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/870B.jpg", ans: "870B", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/877K.png", ans: "877K", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/882C.jpg", ans: "882C", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/920A.jpg", ans: "920A", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/921B.jpg", ans: "921B", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/923K.jpg", ans: "923K", maskT: 0, maskH: 35, opts: colorOptions },
        { url: "colors/926C.jpg", ans: "926C", maskT: 0, maskH: 35, opts: colorOptions }
    ];

    // --- 檢驗標準與異常測試 (對應 GitHub 中文檔名) ---

    const standardLibrary = [

        // 1. 代表號 (保留你之前設定的英文版代表號網址，如果你有上傳中文檔名請自行替換)

        { url: "standards/liang-guang-dai-biao-hao-A.jpg", ans: "A", maskT: 0, maskH: 35, opts: ["A", "B", "C", "K", "Q", "Y"] },

        { url: "standards/ping-guang-dai-biao-hao-B.jpg", ans: "B", maskT: 0, maskH: 35, opts: ["A", "B", "C", "K", "Q", "Y"] },

        { url: "standards/xiao-guang-dai-biao-hao-C.jpg", ans: "C", maskT: 0, maskH: 35, opts: ["A", "B", "C", "K", "Q", "Y"] },

        { url: "standards/hun-he-bai-dian-dai-biao-hao-Q.jpg", ans: "Q", maskT: 0, maskH: 35, opts: ["A", "B", "C", "K", "Q", "Y"] },

        { url: "standards/hun-he-jin-dian-dai-biao-hao-Y.jpg", ans: "Y", maskT: 0, maskH: 35, opts: ["A", "B", "C", "K", "Q", "Y"] },

        { url: "standards/砂紋代表號-K.jpg", ans: "K", maskT: 0, maskH: 35, opts: ["A", "B", "C", "K", "Q", "Y"] },

        

        // 2. 毛料異常

        { url: "standards/毛料-刮傷.jpg", ans: "刮傷", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },

        { url: "standards/毛料-尺寸不良.jpg", ans: "尺寸不良", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },

        { url: "standards/毛料-撞傷撞凹.jpg", ans: "撞傷", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },

        { url: "standards/毛料-模具痕.jpg", ans: "模具痕", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },

        { url: "standards/毛料-氧化1.jpg", ans: "氧化", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良"] },

        { url: "standards/毛料-破洞or氣孔.jpg", ans: "破洞氣孔", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良", "破洞氣孔"] },

        { url: "standards/毛料-變形.jpg", ans: "變形", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "氧化", "氣泡", "模具痕", "變形", "髒汙", "尺寸不良", "破洞氣孔"] },

        

        // 3. 粉體異常

        { url: "standards/粉體-掛勾痕.jpg", ans: "掛勾痕", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },

        { url: "standards/粉體-模具痕.jpg", ans: "模具痕", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },

        { url: "standards/粉體-模厚過厚.jpg", ans: "模厚過厚", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },

        { url: "standards/粉體-橘皮.jpg", ans: "橘皮", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },

        { url: "standards/粉體-火山口.jpg", ans: "火山口", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },

        { url: "standards/粉體-髒污.jpg", ans: "髒污", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "毛刺", "異物附著", "氣泡", "模具痕", "尺寸不良", "破洞氣孔", "火山口", "模厚過厚", "塗裝不全", "橘皮", "掛勾痕", "髒污"] },

        

        // 4. 陽極異常

        { url: "standards/陽極-模具痕.jpg", ans: "模具痕", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },

        { url: "standards/陽極-氣泡.jpg", ans: "氣泡", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },

        { url: "standards/陽極-氧化.jpg", ans: "氧化", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },

        { url: "standards/陽極-色差.jpg", ans: "色差", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },

        { url: "standards/陽極-電鍍不全.jpg", ans: "電鍍不全", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },

        { url: "standards/陽極-電鍍流痕.jpg", ans: "電鍍流痕", maskT: 0, maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },



        // 5. 純文字規格題 (取消圖片，直接顯示文字)

        { type: "text", text: "📝 請問「毛料硬度」的標準規格範圍是？", ans: "11~14", opts: ["1~10", "11~14", "15~20", "21~25", "26~30"] },

        { type: "text", text: "📝 請問「粉體模厚」的標準規格範圍是？", ans: "40um~130um", opts: ["8um~30um", "40um~130um", "130um~150um", "150um~200um"] },

        { type: "text", text: "📝 請問「陽極(電鍍)模厚」的標準規格範圍是？", ans: "8um~30um", opts: ["8um~30um", "40um~130um", "130um~150um", "150um~200um"] }

    ];

    let currentData = [];
    let idx = 0, score = 0;

    function preloadImages() {
        const allImages = [...colorLibrary, ...standardLibrary];
        let loaded = 0;
        const targetCount = allImages.filter(i => i.url).length;
        
        allImages.forEach(item => {
            if (item.url) {
                const img = new Image();
                img.onload = () => {
                    loaded++;
                    if (loaded === targetCount) {
                        document.getElementById('preload-status').innerText = "✅ 資源載入完成，可流暢進行測驗！";
                    }
                };
                img.onerror = () => { loaded++; }; // 失敗也算進進度，避免卡住
                img.src = item.url;
            }
        });
    }

    window.onload = preloadImages;

    function startQuiz(mode) {
        document.getElementById('mode-screen').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'flex';

        if (mode === 'color') {
            document.getElementById('quiz-title').innerText = "🎨 一般色卡辨識";
            currentData = [...colorLibrary];
        } else {
            document.getElementById('quiz-title').innerText = "🔍 檢驗標準測試";
            currentData = [...standardLibrary];
        }

        currentData.sort(() => Math.random() - 0.5);
        idx = 0; score = 0;
        document.getElementById('total').innerText = currentData.length;
        init();
    }

    function init() {
        if (idx >= currentData.length) {
            alert("🌟 訓練結束！總得分：" + score + " / " + currentData.length + "\n點擊確定返回首頁。");
            location.reload();
            return;
        }

        const item = currentData[idx];
        const img = document.getElementById('quiz-img');
        const textContainer = document.getElementById('quiz-text');
        const mask = document.getElementById('mask');
        const feedback = document.getElementById('feedback');
        
        if (item.type === "text") {
            img.style.display = 'none';
            mask.style.display = 'none';
            textContainer.style.display = 'block';
            textContainer.innerText = item.text;
            feedback.innerText = "請根據題目選擇正確規格";
        } else {
            textContainer.style.display = 'none';
            img.style.display = 'block';
            img.src = item.url;
            mask.style.top = item.maskT + "%";
            mask.style.height = item.maskH + "%";
            mask.style.display = (item.maskH > 0) ? 'block' : 'none';
            feedback.innerText = "請判斷圖片中的異常或代表號";
        }

        feedback.className = "";
        document.getElementById('cur').innerText = idx + 1;
        
        const area = document.getElementById('btns');
        area.innerHTML = "";
        
        item.opts.forEach(c => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = c;
            b.onclick = () => checkAnswer(c, item.ans, b, (item.type !== "text" && item.maskH > 0));
            area.appendChild(b);
        });
    }

    function checkAnswer(selected, correct, btnElement, hasMask) {
        const feedback = document.getElementById('feedback');
        const mask = document.getElementById('mask');
        
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
        if(hasMask) mask.style.display = 'none';

        if (selected === correct) {
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✔ 正確！";
            feedback.className = "feedback-correct";
            btnElement.classList.add('selected-correct');
            
            setTimeout(() => { idx++; init(); }, 400); 
        } else {
            feedback.innerText = "✘ 錯誤！";
            feedback.className = "feedback-wrong";
            btnElement.classList.add('selected-wrong');
            
            setTimeout(() => {
                alert("【判斷提醒】\n\n正確答案為：" + correct);
                idx++;
                init();
            }, 100);
        }
    }
</script>
</body>
</html>
