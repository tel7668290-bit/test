<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健合實業 | 色卡辨識訓練 Pro</title>
    <style>
        /* 基礎樣式保持一致 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #f0f2f5; margin: 0; padding: 10px; 
            display: flex; flex-direction: column; align-items: center; 
            height: 100dvh; overflow: hidden; 
        }
        .header { 
            width: 100%; max-width: 420px; display: flex; justify-content: space-between; 
            margin-bottom: 8px; font-weight: bold; color: #4b5563; 
            background: white; padding: 10px 18px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .main-card { 
            background: #ffffff; width: 100%; max-width: 420px; padding: 12px; 
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            flex: 1; display: flex; flex-direction: column; min-height: 0; 
        }

        /* 圖片區域優化 */
        .img-box { 
            position: relative; width: 100%; flex: 0 0 55%; background: #000; 
            border-radius: 12px; overflow: hidden; border: 2px solid #eee; 
        }
        #quiz-img { 
            width: 100%; height: 100%; 
            object-fit: contain; /* 改為 contain 確保看到完整色卡解析度 */
            image-rendering: -webkit-optimize-contrast; /* 強化清晰度 */
        }

        /* 遮罩：遮住實體色卡上的文字 */
        .mask { 
            position: absolute; top: 0; left: 0; width: 100%; height: 28%; 
            background: #111; z-index: 5; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 12px;
        }

        /* 右上角參考號碼 */
        .ref-tag {
            position: absolute; top: 8px; right: 8px; 
            background: rgba(0,0,0,0.7); color: white; 
            padding: 4px 10px; border-radius: 6px; font-size: 12px; 
            z-index: 10; display: none; /* 答對後才顯示 */
        }

        #feedback { 
            font-size: 16px; font-weight: 700; margin: 8px 0; min-height: 40px; 
            display: flex; align-items: center; justify-content: center; border-radius: 10px;
        }
        .feedback-correct { background: #e6fffa; color: #2d6a4f; border: 1px solid #b2f5ea; }
        .feedback-wrong { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }

        .btn-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; 
            overflow-y: auto; padding: 5px; flex: 1;
        }
        button.option-btn { 
            padding: 10px 0; border: 1px solid #d1d5db; background: #fff; 
            color: #1f2937; border-radius: 8px; font-size: 14px; font-weight: 600; 
            cursor: pointer; box-shadow: 0 2px 0 #eee;
        }
        button.option-btn:active { transform: translateY(2px); box-shadow: none; }
        .selected-correct { background: #48bb78 !important; color: white !important; border-color: #38a169 !important; }
        .selected-wrong { background: #f56565 !important; color: white !important; border-color: #e53e3e !important; }
        
        #next-btn { 
            background: #2d3748; color: #fff; width: 100%; padding: 15px; 
            font-size: 16px; font-weight: 800; border: none; border-radius: 12px; 
            margin-top: 10px; display: none; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <div>📊 進度: <span id="cur">1</span>/13</div>
    <div>🎯 得分: <span id="score">0</span></div>
</div>

<div class="main-card">
    <div class="img-box">
        <img id="quiz-img" src="">
        <div class="mask" id="mask">── 標籤遮蔽中 ──</div>
        <div class="ref-tag" id="ref-tag"></div>
    </div>

    <div id="feedback">請觀察顏色</div>

    <div class="btn-grid" id="btns"></div>

    <button id="next-btn">確認下一題 ➔</button>
</div>

<script>
    // 確保連結為原始圖片
    const data = [
        { url: "https://i.ibb.co/JRS11vQx/image.jpg", ans: "01" },
        { url: "https://i.ibb.co/0pZStC4v/image.jpg", ans: "02" },
        { url: "https://i.ibb.co/HT8v9Jr4/image.jpg", ans: "03" },
        { url: "https://i.ibb.co/FbPrgP21/image.jpg", ans: "04" },
        { url: "https://i.ibb.co/ym7STz44/image.jpg", ans: "05" },
        { url: "https://i.ibb.co/yFqNpjF8/image.jpg", ans: "06" },
        { url: "https://i.ibb.co/xq1Nfd4D/image.jpg", ans: "07" },
        { url: "https://i.ibb.co/xqjz076b/image.jpg", ans: "08" },
        { url: "https://i.ibb.co/spMdQkx8/image.jpg", ans: "09" },
        { url: "https://i.ibb.co/tTN5jdf4/image.jpg", ans: "10" },
        { url: "https://i.ibb.co/XrZZCRd8/image.jpg", ans: "11" },
        { url: "https://i.ibb.co/kgyCFrPg/image.jpg", ans: "12" },
        { url: "https://i.ibb.co/4nWmqVGr/image.jpg", ans: "13" }
    ];

    const codes = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13"];
    data.sort(() => Math.random() - 0.5);

    let idx = 0, score = 0;

    function init() {
        const item = data[idx];
        document.getElementById('quiz-img').src = item.url;
        document.getElementById('mask').style.display = 'flex';
        
        const refTag = document.getElementById('ref-tag');
        refTag.innerText = "Ans: P-" + item.ans;
        refTag.style.display = 'none';

        const feedback = document.getElementById('feedback');
        feedback.innerText = "這張是什麼編號？";
        feedback.className = "";

        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('cur').innerText = idx + 1;
        
        const area = document.getElementById('btns');
        area.innerHTML = "";
        
        codes.forEach(c => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = "P-" + c;
            b.onclick = () => {
                document.getElementById('mask').style.display = 'none';
                document.getElementById('ref-tag').style.display = 'block';
                document.querySelectorAll('.option-btn').forEach(el => el.disabled = true);
                
                if(c === item.ans) {
                    feedback.innerText = "正確！Plate " + item.ans;
                    feedback.className = "feedback-correct";
                    b.classList.add("selected-correct");
                    score++;
                } else {
                    feedback.innerText = "不對喔，是 Plate " + item.ans;
                    feedback.className = "feedback-wrong";
                    b.classList.add("selected-wrong");
                }
                document.getElementById('score').innerText = score;
                document.getElementById('next-btn').style.display = 'block';
            };
            area.appendChild(b);
        });
    }

    document.getElementById('next-btn').onclick = () => {
        idx++;
        if(idx < data.length) {
            init();
        } else {
            alert("測驗結束！最終得分：" + score + " / 13");
            location.reload();
        }
    };

    window.onload = init;
</script>
</body>
</html>
