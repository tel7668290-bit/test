<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>健合實業 | 色卡辨識自動訓練系統</title>
    <style>
        * { box-sizing: border-box; cursor: default; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
        }

        .container {
            width: 100%; max-width: 1200px; background: #1e293b;
            padding: 30px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .header { 
            display: flex; justify-content: space-between; margin-bottom: 25px; 
            font-size: 24px; font-weight: 800; border-bottom: 2px solid #334155; padding-bottom: 15px;
        }
        .header span { color: #38bdf8; }

        .img-box { 
            position: relative; width: 100%; height: 650px; 
            background: #000; border-radius: 16px; overflow: hidden; 
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #475569;
        }

        #quiz-img { 
            max-width: 100%; max-height: 100%; object-fit: contain; 
            image-rendering: -webkit-optimize-contrast; 
        }

        #mask { 
            position: absolute; left: 0; width: 100%; background: #000; 
            z-index: 10; border-bottom: 2px solid #1e293b;
        }

        #feedback { 
            font-size: 28px; font-weight: 700; margin: 20px 0; min-height: 80px; 
            display: flex; align-items: center; justify-content: center; border-radius: 12px;
        }
        .feedback-correct { background: #064e3b; color: #4ade80; }
        .feedback-wrong { background: #7f1d1d; color: #f87171; }

        .btn-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
            gap: 15px; margin-top: 10px;
        }
        button.option-btn { 
            padding: 20px 0; border: 1px solid #475569; background: #334155; 
            color: #f8fafc; border-radius: 12px; font-size: 20px; font-weight: 700; 
            cursor: pointer; transition: 0.2s;
        }
        button.option-btn:hover:not(:disabled) { background: #475569; transform: translateY(-2px); }
        .selected-correct { background: #22c55e !important; }
        .selected-wrong { background: #ef4444 !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>📊 進度: <span id="cur">1</span> / 13</div>
        <div>🏆 分數: <span id="score">0</span></div>
    </div>

    <div class="img-box">
        <img id="quiz-img" src="">
        <div id="mask"></div>
    </div>

    <div id="feedback">辨識色彩中...</div>

    <div class="btn-grid" id="btns"></div>
</div>

<script>
    const quizData = [
        { url: "S__142196743_0.jpg", ans: "220B", maskT: 45, maskH: 25 },
        { url: "S__142196744_0.jpg", ans: "120A", maskT: 50, maskH: 30 },
        { url: "S__142196745_0.jpg", ans: "121A", maskT: 55, maskH: 25 },
        { url: "S__142196746_0.jpg", ans: "231B", maskT: 55, maskH: 25 },
        { url: "S__142196747_01.jpg", ans: "920A", maskT: 30, maskH: 25 },
        { url: "S__142196747_0@.jpg", ans: "921B", maskT: 45, maskH: 25 },
        { url: "S__142196748_0.jpg", ans: "926C", maskT: 30, maskH: 25 },
        { url: "S__142196749_0.jpg", ans: "923K", maskT: 35, maskH: 25 },
        { url: "S__142196750_01.jpg", ans: "801K", maskT: 35, maskH: 25 },
        { url: "S__142196750_02.jpg", ans: "877K", maskT: 35, maskH: 25 },
        { url: "S__142196750_03.jpg", ans: "923K", maskT: 35, maskH: 25 },
        { url: "S__142196751_0.jpg", ans: "882C", maskT: 40, maskH: 25 },
        { url: "S__142196752_0.jpg", ans: "813B", maskT: 40, maskH: 25 }
    ];

    const codes = ["220B", "120A", "121A", "231B", "920A", "921B", "926C", "923K", "801K", "877K", "882C", "813B"];
    
    quizData.sort(() => Math.random() - 0.5);

    let idx = 0, score = 0;

    function init() {
        if (idx >= quizData.length) {
            alert("🌟 訓練結束！總得分：" + score + " / " + quizData.length);
            location.reload();
            return;
        }

        const item = quizData[idx];
        const img = document.getElementById('quiz-img');
        const mask = document.getElementById('mask');
        const feedback = document.getElementById('feedback');
        
        img.src = item.url;
        mask.style.top = item.maskT + "%";
        mask.style.height = item.maskH + "%";
        mask.style.display = 'block';

        feedback.innerText = "請點擊編號";
        feedback.className = "";
        document.getElementById('cur').innerText = idx + 1;
        
        const area = document.getElementById('btns');
        area.innerHTML = "";
        
        codes.forEach(c => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = c;
            b.onclick = () => checkAnswer(c, item.ans, b);
            area.appendChild(b);
        });
    }

    function checkAnswer(selected, correct, btnElement) {
        const feedback = document.getElementById('feedback');
        const mask = document.getElementById('mask');
        
        // 禁用所有按鈕防止重複點擊
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
        mask.style.display = 'none'; // 揭曉圖片文字

        if (selected === correct) {
            // 答對邏輯
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✔ 正確！下一題...";
            feedback.className = "feedback-correct";
            btnElement.classList.add('selected-correct');
            
            // 0.8秒後自動下一題
            setTimeout(() => {
                idx++;
                init();
            }, 800);
        } else {
            // 答錯邏輯
            feedback.innerText = "✘ 答錯了！正確是 " + correct;
            feedback.className = "feedback-wrong";
            btnElement.classList.add('selected-wrong');
            
            // 彈窗警告，確認後手動下一題
            setTimeout(() => {
                alert("【答錯提醒】\n\n這張色卡的正確編號應為：" + correct + "\n請記住這個顏色與編號的對應。");
                idx++;
                init();
            }, 100);
        }
    }

    window.onload = init;
</script>
</body>
</html>
