<body>

<div class="score-bar">進度: <span id="cur">1</span>/12 | 得分: <span id="score">0</span></div>
<div class="header">
    <div>📝 題數: <span id="cur">1</span>/12</div>
    <div>🏆 得分: <span id="score">0</span></div>
</div>

<div class="main-card">
    <div class="img-box">
        <img id="quiz-img" src="">
        <div class="mask" id="mask">標籤隱藏</div>
        <div class="mask" id="mask">🔒 標籤已遮蔽</div>
    </div>

    <div id="feedback"></div>

    <div class="btn-grid" id="btns"></div>

    <button id="next-btn">下一題 ➔</button>
</div>

<script>
    // 重新精確校對過的圖片對應表
    const data = [
        { url: "https://i.postimg.cc/jqfpgmv1/S-141926458-0.jpg", ans: "877K" },
        { url: "https://i.postimg.cc/9X968KJV/S-141926459-0.jpg", ans: "801K" },
        { url: "https://i.postimg.cc/44cDLqBs/S-141926460-0.jpg", ans: "923K" },
        { url: "https://i.postimg.cc/G3DW7VqR/S-141926461-0.jpg", ans: "926C" },
        { url: "https://i.postimg.cc/T2bz7FCT/S-141926462-0.jpg", ans: "920A" },
        { url: "https://i.postimg.cc/wxNCfZ0x/S-141926463-0.jpg", ans: "921B" },
        { url: "https://i.postimg.cc/zDhst60B/S-141926464-0.jpg", ans: "120A" },
        { url: "https://i.postimg.cc/jqfpgmZC/S-141926465-0.jpg", ans: "121A" },
        { url: "https://i.postimg.cc/ZYNG72VB/S-141926466-0.jpg", ans: "292K" },
        { url: "https://i.postimg.cc/J4W99x2h/S-141926467-0.jpg", ans: "220B" },
        { url: "https://i.postimg.cc/YqwJJRs0/S-141926469-0.jpg", ans: "813B" }, // 已校正為 813B
        { url: "https://i.postimg.cc/J4W99x2n/S-141926470-0.jpg", ans: "920A" }  // 複訓 920A
        { url: "https://i.postimg.cc/YqwJJRs0/S-141926469-0.jpg", ans: "813B" }, 
        { url: "https://i.postimg.cc/J4W99x2n/S-141926470-0.jpg", ans: "920A" }  
    ];

    const codes = ["877K", "801K", "923K", "926C", "920A", "921B", "120A", "121A", "292K", "220B", "813B"];
    data.sort(() => Math.random() - 0.5);

    let idx = 0, score = 0;

    function init() {
        const item = data[idx];
        document.getElementById('quiz-img').src = item.url;
        document.getElementById('mask').style.display = 'flex';
        document.getElementById('feedback').innerText = "";
        
        const feedback = document.getElementById('feedback');
        feedback.innerText = "請選擇對應的色號";
        feedback.className = "";
        feedback.style.color = "#6b7280";

        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('cur').innerText = idx + 1;

        const area = document.getElementById('btns');
        area.innerHTML = "";
        codes.forEach(c => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = c;
            b.onclick = () => {
                document.getElementById('mask').style.display = 'none';
                document.querySelectorAll('#btns button').forEach(el => el.disabled = true);
                document.querySelectorAll('.option-btn').forEach(el => el.disabled = true);
                
                if(c === item.ans) {
                    document.getElementById('feedback').innerText = "✅ 正確: " + item.ans;
                    document.getElementById('feedback').style.color = "#28a745";
                    feedback.innerText = "🎉 答對了！色號是 " + item.ans;
                    feedback.className = "feedback-correct";
                    b.classList.add("selected-correct");
                    score++;
                } else {
                    document.getElementById('feedback').innerText = "❌ 正確是 " + item.ans;
                    document.getElementById('feedback').style.color = "#dc3545";
                    feedback.innerText = "❌ 答錯了，正確應為 " + item.ans;
                    feedback.className = "feedback-wrong";
                    b.classList.add("selected-wrong");
                }
                document.getElementById('score').innerText = score;
                document.getElementById('next-btn').style.display = 'block';
            };
            area.appendChild(b);
        });
    }

    document.getElementById('next-btn').onclick = () => {
        idx++;
        if(idx < data.length) init();
        else {
            alert("測驗結束！總分：" + score + "/12");
        if(idx < data.length) {
            init();
        } else {
            alert("🌟 測驗結束！您的總得分：" + score + " / 12");
            location.reload();
        }
    };
    window.onload = init;
</script>
</body>
