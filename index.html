<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>清展科技-品保部 | 辨色與檢驗標準測試</title>
    <style>
        * { box-sizing: border-box; cursor: default; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; overflow: hidden;
        }

        /* ---------------- 首頁樣式 ---------------- */
        #mode-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; transition: opacity 0.5s;
        }
        .mode-title { font-size: 36px; margin-bottom: 10px; color: #f8fafc; letter-spacing: 2px; text-align: center; line-height: 1.3;}
        .mode-btn {
            padding: 15px 40px; font-size: 22px; font-weight: 900;
            background: #38bdf8; color: #0f172a; border: none; border-radius: 16px;
            cursor: pointer; transition: 0.2s; box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            width: 85%; max-width: 400px; text-align: center;
        }
        .mode-btn:hover { transform: translateY(-3px); background: #7dd3fc; }
        .mode-btn.exam { background: #fbbf24; }
        .mode-btn.exam:hover { background: #fcd34d; }
        .mode-btn.gallery { background: #c084fc; color: #fff; }
        .mode-btn.gallery:hover { background: #d8b4fe; }

        /* ---------------- 測驗畫面樣式 ---------------- */
        .container {
            width: 100%; max-width: 1400px; background: #1e293b;
            padding: 15px; border-radius: 16px; box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            display: none; flex-direction: column; height: 95vh;
        }
        .header { 
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; 
            font-size: 20px; font-weight: 800; border-bottom: 2px solid #334155; padding-bottom: 10px;
        }
        .header span { color: #38bdf8; }
        
        .main-content { display: flex; flex: 1; gap: 15px; min-height: 0; }
        
        /* 左側圖片區塊 (直接作為定位基準) */
        .left-panel {
            flex: 6; background: #000; 
            border-radius: 12px; overflow: hidden; border: 1px solid #475569;
            display: flex; align-items: center; justify-content: center; position: relative;
        }

        #quiz-img { 
            max-width: 100%; max-height: 100%; 
            width: auto; height: auto; display: block; 
        }

        #quiz-text {
            display: none; font-size: 36px; font-weight: 900; color: #38bdf8;
            text-align: center; padding: 20px; line-height: 1.4; width: 100%;
        }
        
        /* 遮罩加了微弱光暈，讓它看起來更自然 */
        #mask { 
            position: absolute; background: #000; z-index: 10; 
            border: 1px solid #1e293b; border-radius: 4px; box-shadow: 0 0 5px rgba(0,0,0,0.8);
            display: none; 
        }
        
        #debug-coords {
            display: none; position: absolute; top: 15px; left: 15px;
            background: rgba(255, 0, 0, 0.9); color: #fff; font-weight: 900;
            padding: 10px 15px; border-radius: 8px; z-index: 100; font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); letter-spacing: 1px;
        }

        .right-panel {
            flex: 4; display: flex; flex-direction: column; background: #334155;
            padding: 15px; border-radius: 12px; overflow-y: auto;
        }
        #feedback { 
            font-size: 20px; font-weight: 700; margin-bottom: 15px; 
            min-height: 50px; display: flex; align-items: center; justify-content: center;
            text-align: center; border-radius: 8px;
        }
        .feedback-correct { background: #064e3b; color: #4ade80; }
        .feedback-wrong { background: #7f1d1d; color: #f87171; }
        
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        button.option-btn { 
            padding: 12px 5px; border: 1px solid #475569; background: #1e293b; 
            color: #f8fafc; border-radius: 8px; font-size: 16px; font-weight: 700; 
            cursor: pointer; transition: 0.2s;
        }
        button.option-btn:hover:not(:disabled) { background: #38bdf8; color: #0f172a; }
        .selected-correct { background: #22c55e !important; color: white !important; }
        .selected-wrong { background: #ef4444 !important; color: white !important; }
        
        .bottom-actions { margin-top: auto; display: flex; justify-content: flex-end; padding-top: 15px; }
        #preload-status { color: #94a3b8; font-size: 14px; margin-top: 15px; }

        /* ---------------- 結算與錯題回顧畫面 ---------------- */
        #result-screen {
            width: 100%; max-width: 1000px; background: #1e293b;
            padding: 30px; border-radius: 16px; box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            display: none; flex-direction: column; align-items: center; height: 90vh;
        }
        #final-score { font-size: 36px; font-weight: 900; color: #fbbf24; margin-bottom: 20px; }
        #wrong-list-container {
            width: 100%; flex: 1; overflow-y: auto; background: #0f172a; 
            border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #334155;
        }
        .wrong-card {
            background: #334155; border-radius: 8px; padding: 12px;
            margin-bottom: 12px; display: flex; align-items: center; gap: 15px;
        }
        .wrong-img { width: 120px; height: 80px; object-fit: contain; background: #000; border-radius: 6px; border: 1px solid #475569; }
        .wrong-text-q { width: 120px; font-size: 14px; color: #38bdf8; font-weight: bold; line-height: 1.3; text-align: center; }
        .wrong-info { flex: 1; font-size: 18px; font-weight: 700; line-height: 1.6; }
        .wrong-ans { color: #f87171; }
        .correct-ans { color: #4ade80; }

        /* ---------------- 題庫總覽畫面 ---------------- */
        #gallery-screen {
            width: 100%; max-width: 1400px; background: #1e293b;
            padding: 15px; border-radius: 16px; box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            display: none; flex-direction: column; height: 95vh;
        }
        .gallery-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 15px;
            flex-wrap: wrap; gap: 10px;
        }
        .gallery-header h2 { margin: 0; font-size: 24px; color: #f8fafc; }
        .gallery-nav {
            display: flex; gap: 10px; margin-bottom: 15px;
            justify-content: center; flex-wrap: wrap;
        }
        .gallery-nav-btn {
            background: #334155; color: #cbd5e1; border: 2px solid #475569;
            padding: 8px 20px; border-radius: 30px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .gallery-nav-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .gallery-nav-btn.active.exam-tab { background: #fbbf24; border-color: #fbbf24; }
        
        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px; overflow-y: auto; padding-right: 5px; flex: 1; 
        }
        .gallery-card {
            background: #0f172a; border: 1px solid #334155; border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); height: 100%;
        }
        .gallery-img-wrapper {
            width: 100%; height: 180px; background: #000;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            border-bottom: 1px solid #334155; padding: 5px; 
            cursor: pointer; transition: 0.2s; 
        }
        .gallery-img-wrapper:hover { opacity: 0.8; }
        .gallery-img-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .gallery-ans {
            margin-top: auto; margin-bottom: 15px; font-size: 20px; font-weight: 900; color: #4ade80;
            background: #064e3b; padding: 5px 15px; border-radius: 20px;
        }

        /* ---------------- 圖片放大視窗 (Modal) ---------------- */
        #image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); z-index: 999; 
            justify-content: center; align-items: center; flex-direction: column; cursor: pointer;
        }
        .modal-content {
            position: relative; max-width: 95%; max-height: 90%;
            display: flex; flex-direction: column; align-items: center; cursor: default;
        }
        #modal-img {
            max-width: 100%; max-height: 70vh; object-fit: contain; 
            border-radius: 8px; border: 2px solid #475569;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #modal-caption {
            margin-top: 20px; font-size: 28px; font-weight: 900; color: #4ade80;
            background: #064e3b; padding: 8px 30px; border-radius: 20px; text-align: center;
        }
        .modal-close {
            position: absolute; top: -40px; right: 0; background: none; border: none;
            color: #cbd5e1; font-size: 40px; cursor: pointer; line-height: 1; padding: 0;
        }
        .modal-close:hover { color: #fff; }

        /* 📱 手機版專屬優化 */
        @media (max-width: 768px) {
            body { padding: 8px; }
            .header { font-size: 16px; }
            .main-content { flex-direction: column; }
            .left-panel { flex: none; height: auto; background: transparent; border: none; }
            #quiz-img { max-height: 40vh; border-radius: 8px; }
            .right-panel { flex: 1; padding: 12px; display: flex; flex-direction: column; }
            #feedback { font-size: 18px; min-height: 40px; margin-bottom: 10px; }
            .btn-grid { gap: 8px; }
            button.option-btn { font-size: 16px; padding: 14px 5px; }
            .wrong-card { flex-direction: column; text-align: center; }
            #final-score { font-size: 28px; }
            .gallery-nav-btn { font-size: 16px; padding: 8px 15px; width: 48%; text-align: center; }
            #modal-img { max-height: 65vh; }
            #modal-caption { font-size: 24px; padding: 6px 25px; }
            .modal-close { top: -45px; right: -10px; font-size: 50px; }
            #debug-coords { font-size: 14px; top: 5px; left: 5px; padding: 5px 10px; }
        }
    </style>
</head>
<body>

<div id="mode-screen">
    <div class="mode-title">清展科技-品保部<br>教育訓練系統</div>
    <button class="mode-btn" onclick="startQuiz('color')">🎨 一般色卡辨識</button>
    <button class="mode-btn exam" onclick="startQuiz('standard')">🔍 檢驗標準測試</button>
    <button class="mode-btn gallery" onclick="showGallery()">📚 題庫預習區</button>
    <div id="preload-status">⏳ 圖片資源預先載入中...</div>
</div>

<div id="gallery-screen">
    <div class="gallery-header">
        <h2>📚 題庫預習區</h2>
        <button class="mode-btn exam" style="font-size: 14px; padding: 8px 15px; width: auto; box-shadow: none;" onclick="location.reload()">🏠 返回首頁</button>
    </div>
    <div class="gallery-nav">
        <button id="tab-color" class="gallery-nav-btn active" onclick="renderGallery('color')">🎨 色卡題庫</button>
        <button id="tab-standard" class="gallery-nav-btn" onclick="renderGallery('standard')">🔍 檢驗標準題庫</button>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
</div>

<div id="image-modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <img id="modal-img" src="" alt="放大圖片">
        <div id="modal-caption"></div>
    </div>
</div>

<div class="container" id="quiz-container">
    <div class="header">
        <div id="quiz-title">模式載入中...</div>
        <div>📊 進度: <span id="cur">1</span> / <span id="total">0</span> &nbsp;|&nbsp; 🏆 得分: <span id="score">0</span></div>
    </div>
    <div class="main-content">
        <div class="left-panel">
            <div id="debug-coords"></div>
            <img id="quiz-img" src="">
            <div id="quiz-text"></div>
            <div id="mask"></div>
        </div>
        <div class="right-panel">
            <div id="feedback">請根據圖片選擇正確答案 (方向鍵可微調遮罩)</div>
            <div class="btn-grid" id="btns"></div>
            <div class="bottom-actions">
                <button class="mode-btn exam" style="font-size: 14px; padding: 8px 16px; width: auto; box-shadow: none;" onclick="location.reload()">🏠 返回首頁</button>
            </div>
        </div>
    </div>
</div>

<div id="result-screen">
    <div style="font-size: 28px; font-weight: 900; color: #f8fafc; margin-bottom: 10px;">測驗結束</div>
    <div id="final-score">總得分：0 / 0</div>
    <div style="width: 100%; font-size: 18px; color: #94a3b8; margin-bottom: 10px; font-weight: 700;">📝 錯題回顧清單：</div>
    <div id="wrong-list-container"></div>
    <button class="mode-btn exam" style="font-size: 18px; padding: 12px 30px; width: auto;" onclick="location.reload()">🏠 返回首頁重新測驗</button>
</div>

        { url: "standards/陽極-模具痕.jpg", ans: "模具痕", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-氣泡.jpg", ans: "氣泡", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-氧化.jpg", ans: "氧化", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-色差.jpg", ans: "色差", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-電鍍不全.jpg", ans: "電鍍不全", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] },
        { url: "standards/陽極-電鍍流痕.jpg", ans: "電鍍流痕", maskH: 0, opts: ["撞傷", "刮傷", "氧化", "異物附著", "氣泡", "模具痕", "電鍍流痕", "電鍍不全", "變形", "髒汙", "模厚", "色差"] }
    ];

    let currentData = [], idx = 0, score = 0;
    let wrongAnswers = [];

    // --- 👑 全新：JS 像素級精準導彈定位系統 ---
    function placeMask() {
        const img = document.getElementById('quiz-img');
        const msk = document.getElementById('mask');
        const item = currentData[idx];
        
        if (!item || item.type === "text" || !item.maskH) {
            msk.style.display = 'none';
            return;
        }

        // 讀取圖片「當下」在螢幕上真實佔用的像素與座標
        const imgW = img.clientWidth;
        const imgH = img.clientHeight;
        const offsetX = img.offsetLeft;
        const offsetY = img.offsetTop;

        // 計算絕對像素並強制釘死
        msk.style.top = (offsetY + (imgH * item.maskT / 100)) + "px";
        msk.style.left = (offsetX + (imgW * item.maskL / 100)) + "px";
        msk.style.width = (imgW * item.maskW / 100) + "px";
        msk.style.height = (imgH * item.maskH / 100) + "px";
        msk.style.display = 'block';
    }

    // 螢幕旋轉或改變大小時，重新計算一次導彈座標
    window.addEventListener('resize', () => {
        if(document.getElementById('quiz-container').style.display === 'flex') {
            placeMask();
        }
    });

    // --- 鍵盤微調系統 (配合新座標引擎) ---
    document.addEventListener('keydown', (e) => {
        if(document.getElementById('quiz-container').style.display === 'none') return;
        const item = currentData[idx];
        if(!item || item.type === 'text' || !item.maskH) return;

        let changed = false;
        if(e.key === 'w' || e.key === 'ArrowUp') { item.maskT -= 0.5; changed = true; }
        if(e.key === 's' || e.key === 'ArrowDown') { item.maskT += 0.5; changed = true; }
        if(e.key === 'a' || e.key === 'ArrowLeft') { item.maskL -= 0.5; changed = true; }
        if(e.key === 'd' || e.key === 'ArrowRight') { item.maskL += 0.5; changed = true; }

        if(changed) {
            e.preventDefault();
            placeMask(); // 立即套用新座標
            const dbg = document.getElementById('debug-coords');
            dbg.style.display = 'block';
            dbg.innerHTML = `微調完成請更新程式碼：<br>maskT: <span style="color:#fbbf24">${item.maskT}</span><br>maskL: <span style="color:#fbbf24">${item.maskL}</span>`;
        }
    });

    function openModal(url, text) {
        document.getElementById('modal-img').src = url;
        document.getElementById('modal-caption').innerText = text;
        document.getElementById('image-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('image-modal').style.display = 'none'; }

    function preloadImages() {
        const all = [...colorLibrary, ...standardLibrary].filter(i => i.url);
        let loaded = 0;
        all.forEach(item => {
            const img = new Image();
            img.onload = img.onerror = () => {
                loaded++;
                if (loaded === all.length) document.getElementById('preload-status').innerText = "✅ 資源已備妥";
            };
            img.src = encodeURI(item.url);
        });
    }
    window.onload = preloadImages;

    function showGallery() {
        document.getElementById('mode-screen').style.display = 'none';
        document.getElementById('gallery-screen').style.display = 'flex';
        renderGallery('color'); 
    }

    function renderGallery(type) {
        document.getElementById('tab-color').classList.remove('active', 'exam-tab');
        document.getElementById('tab-standard').classList.remove('active', 'exam-tab');
        if (type === 'color') document.getElementById('tab-color').classList.add('active');
        else document.getElementById('tab-standard').classList.add('active', 'exam-tab');

        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = ""; 
        const dataToRender = (type === 'color') ? colorLibrary : standardLibrary;
        
        dataToRender.forEach(item => {
            const card = document.createElement('div');
            card.className = "gallery-card";
            if (item.type === "text") {
                card.innerHTML = `
                    <div style="width: 100%; min-height: 120px; display: flex; align-items: center; justify-content: center; padding: 20px; background: #1e293b; border-bottom: 1px solid #334155;">
                        <div style="color: #38bdf8; font-weight: bold; font-size: 18px; text-align: center; line-height: 1.4;">${item.text}</div>
                    </div>
                    <div style="width: 100%; padding: 15px; display: flex; justify-content: center; align-items: center; flex: 1;">
                        <div style="font-size: 20px; font-weight: 900; color: #4ade80; background: #064e3b; padding: 6px 25px; border-radius: 20px; margin-top: 5px;">${item.ans}</div>
                    </div>
                `;
            } else {
                const safeUrl = encodeURI(item.url);
                card.innerHTML = `
                    <div class="gallery-img-wrapper" onclick="openModal('${safeUrl}', '${item.ans}')">
                        <img src="${safeUrl}" alt="圖片">
                    </div>
                    <div style="margin-top: 15px; margin-bottom: 5px; font-size: 22px; font-weight: 900; color: #4ade80; background: #064e3b; padding: 6px 20px; border-radius: 20px;">${item.ans}</div>
                `;
            }
            grid.appendChild(card);
        });
    }

    function startQuiz(mode) {
        document.getElementById('mode-screen').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'flex';
        currentData = (mode === 'color') ? [...colorLibrary] : [...standardLibrary];
        document.getElementById('quiz-title').innerText = (mode === 'color') ? "🎨 一般色卡辨識" : "🔍 檢驗標準測試";
        currentData.sort(() => Math.random() - 0.5);
        idx = 0; score = 0; wrongAnswers = [];
        document.getElementById('total').innerText = currentData.length;
        init();
    }

    function showResultScreen() {
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('final-score').innerText = `總得分：${score} / ${currentData.length}`;
        const listContainer = document.getElementById('wrong-list-container');
        listContainer.innerHTML = "";

        if (wrongAnswers.length === 0) {
            listContainer.innerHTML = `<div style="text-align: center; padding: 40px; font-size: 24px; color: #4ade80; font-weight: 900;">🎉 太棒了！全部答對，完美通關！</div>`;
        } else {
            wrongAnswers.forEach(wrong => {
                const card = document.createElement('div');
                card.className = "wrong-card";
                let mediaHtml = wrong.item.type === "text" ? `<div class="wrong-text-q">${wrong.item.text}</div>` : `<img src="${encodeURI(wrong.item.url)}" class="wrong-img">`;
                card.innerHTML = `
                    ${mediaHtml}
                    <div class="wrong-info">
                        <div style="color: #94a3b8; font-size: 14px; margin-bottom: 5px;">你的選擇：<span class="wrong-ans">${wrong.userAns}</span></div>
                        <div style="font-size: 16px;">正確答案：<span class="correct-ans">${wrong.item.ans}</span></div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }
    }

    function init() {
        if (idx >= currentData.length) { showResultScreen(); return; }
        const item = currentData[idx];
        const img = document.getElementById('quiz-img'), txt = document.getElementById('quiz-text'), msk = document.getElementById('mask'), fbk = document.getElementById('feedback'), dbg = document.getElementById('debug-coords');
        
        dbg.style.display = 'none'; 

        if (item.type === "text") {
            img.style.display = msk.style.display = 'none';
            txt.style.display = 'block'; txt.innerText = item.text;
            fbk.innerText = "請選擇正確規格";
        } else {
            txt.style.display = 'none'; 
            img.style.display = 'block';
            
            // 💡 關鍵：圖片載入完成後，立刻啟動導彈定位系統
            img.onload = () => { placeMask(); };
            img.src = encodeURI(item.url);
            
            fbk.innerText = "請根據圖片選擇正確答案 (方向鍵可微調遮罩)";
        }
        fbk.className = ""; document.getElementById('cur').innerText = idx + 1;
        const area = document.getElementById('btns'); area.innerHTML = "";
        item.opts.forEach(c => {
            const b = document.createElement('button'); b.className = "option-btn"; b.innerText = c;
            b.onclick = () => checkAnswer(c, item.ans, b, (item.type !== "text" && item.maskH > 0));
            area.appendChild(b);
        });
    }

    function checkAnswer(selected, correct, btn, hasMask) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        if(hasMask) document.getElementById('mask').style.display = 'none';
        const fbk = document.getElementById('feedback');
        if (selected === correct) {
            score++; document.getElementById('score').innerText = score;
            fbk.innerText = "✔ 正確！"; fbk.className = "feedback-correct"; btn.classList.add('selected-correct');
            setTimeout(() => { idx++; init(); }, 400); 
        } else {
            wrongAnswers.push({ item: currentData[idx], userAns: selected });
            fbk.innerText = "✘ 錯誤！"; fbk.className = "feedback-wrong"; btn.classList.add('selected-wrong');
            setTimeout(() => { alert("【判斷提醒】\n\n正確答案為：" + correct); idx++; init(); }, 100);
        }
    }
</script>
</body>
